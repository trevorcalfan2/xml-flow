name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Debug
        run: |
          echo "USER: $(whoami)"
          echo "GROUPS: $(groups)"
          echo "DOCKER: $(which docker || echo NOT FOUND)"
          docker ps 2>&1 | head -3

      - name: Deploy
        run: |
          DEPLOY_DIR=/home/evangelion/xml-flow

          # Sync repo files (exclude .git)
          mkdir -p "$DEPLOY_DIR"
          rsync -a --exclude='.git' repo/ "$DEPLOY_DIR/"

          cd "$DEPLOY_DIR"

          # Bring up containers (build if changed)
          docker compose down
          docker compose up -d --build

          # Wait for app to be healthy
          sleep 10
          docker compose ps
