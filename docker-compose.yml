version: '3.8'

services:
  app:
    build: .
    container_name: xml-flow
    ports:
      - "6972:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: xmlflow
      DB_USERNAME: xmlflow
      DB_PASSWORD: xmlflow123

  db:
    image: mysql:8.0
    container_name: xml-flow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: xmlflow
      MYSQL_USER: xmlflow
      MYSQL_PASSWORD: xmlflow123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "xmlflow", "-pxmlflow123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
